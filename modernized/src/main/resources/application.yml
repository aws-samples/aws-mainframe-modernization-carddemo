server:
  port: 8080
spring:
  application:
    name: modernized-mainframe-core
  datasource:
    url: ${DB_JDBC_URL:jdbc:h2:mem:modernized_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 3000
      validation-timeout: 2000
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: false
