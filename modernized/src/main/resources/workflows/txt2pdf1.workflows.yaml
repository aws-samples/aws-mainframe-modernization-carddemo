# Google Cloud Workflows definition modernized from JCL: TXT2PDF1
# Source: app/jcl/TXT2PDF1.JCL
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - txt2pdf:
        raise: "Step TXT2PDF runs program IKJEFT1B, which is not part of the modernized application"
    - finalize:
        return: ${"Job txt2pdf1 completed, execution " + executionId}
