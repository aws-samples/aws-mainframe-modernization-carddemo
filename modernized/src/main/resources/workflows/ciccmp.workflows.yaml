# Google Cloud Workflows definition modernized from JCL: CICCMP
# Source: samples/jcl/CICCMP.jcl
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - cicscmp:
        raise: "Step CICSCMP runs procedure BUILDONL, which is not part of the modernized application"
    - newcopy:
        raise: "Step NEWCOPY runs program SDSF, which is not part of the modernized application"
    - finalize:
        return: ${"Job ciccmp completed, execution " + executionId}
