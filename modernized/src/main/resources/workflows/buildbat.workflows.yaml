# Google Cloud Workflows definition modernized from JCL: BUILDBAT
# Source: samples/proc/BUILDBAT.prc
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - compile:
        raise: "Step COMPILE runs program IGYCRCTL, which is not part of the modernized application"
    - cblprint:
        raise: "Step CBLPRINT runs program IEBGENER, which is not part of the modernized application"
    - lked:
        raise: "Step LKED runs program HEWL, which is not part of the modernized application"
    - finalize:
        return: ${"Job buildbat completed, execution " + executionId}
