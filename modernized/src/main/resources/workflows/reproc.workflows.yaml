# Google Cloud Workflows definition modernized from JCL: REPROC
# Source: app/proc/REPROC.prc
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - prc001:
        raise: "Step PRC001 runs program IDCAMS, which is not part of the modernized application"
    - finalize:
        return: ${"Job reproc completed, execution " + executionId}
