# Google Cloud Workflows definition modernized from JCL: LISTCAT
# Source: samples/jcl/LISTCAT.jcl
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - step01:
        raise: "Step STEP01 runs program IEFBR14, which is not part of the modernized application"
    - step05:
        raise: "Step STEP05 runs program IDCAMS, which is not part of the modernized application"
    - finalize:
        return: ${"Job listcat completed, execution " + executionId}
