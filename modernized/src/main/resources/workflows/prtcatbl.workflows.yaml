# Google Cloud Workflows definition modernized from JCL: PRTCATBL
# Source: app/jcl/PRTCATBL.jcl
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - deldef:
        raise: "Step DELDEF runs program IEFBR14, which is not part of the modernized application"
    - step05r:
        raise: "Step STEP05R runs procedure REPROC, which is not part of the modernized application"
    - step10r:
        raise: "Step STEP10R runs program SORT, which is not part of the modernized application"
    - finalize:
        return: ${"Job prtcatbl completed, execution " + executionId}
