# Google Cloud Workflows definition modernized from JCL: TRANFILE
# Source: app/jcl/TRANFILE.jcl
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - clcifil:
        raise: "Step CLCIFIL runs program SDSF, which is not part of the modernized application"
    - step05:
        raise: "Step STEP05 runs program IDCAMS, which is not part of the modernized application"
    - step10:
        raise: "Step STEP10 runs program IDCAMS, which is not part of the modernized application"
    - step15:
        raise: "Step STEP15 runs program IDCAMS, which is not part of the modernized application"
    - step20:
        raise: "Step STEP20 runs program IDCAMS, which is not part of the modernized application"
    - step25:
        raise: "Step STEP25 runs program IDCAMS, which is not part of the modernized application"
    - step30:
        raise: "Step STEP30 runs program IDCAMS, which is not part of the modernized application"
    - opcifil:
        raise: "Step OPCIFIL runs program SDSF, which is not part of the modernized application"
    - finalize:
        return: ${"Job tranfile completed, execution " + executionId}
