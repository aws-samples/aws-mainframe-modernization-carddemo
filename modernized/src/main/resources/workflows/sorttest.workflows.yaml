# Google Cloud Workflows definition modernized from JCL: SORTTEST
# Source: samples/jcl/SORTTEST.jcl
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - step05r:
        raise: "Step STEP05R runs program SORT, which is not part of the modernized application"
    - finalize:
        return: ${"Job sorttest completed, execution " + executionId}
