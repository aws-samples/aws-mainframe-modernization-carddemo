# Google Cloud Workflows definition modernized from JCL: CREADB21
# Source: app/app-transaction-type-db2/jcl/CREADB21.jcl
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - freepln:
        raise: "Step FREEPLN runs program IKJEFT01, which is not part of the modernized application"
    - crcrddb:
        raise: "Step CRCRDDB runs program IKJEFT01, which is not part of the modernized application"
    - ldttype:
        raise: "Step LDTTYPE runs program IEFBR14, which is not part of the modernized application"
    - runtep2:
        raise: "Step RUNTEP2 runs program IKJEFT01, which is not part of the modernized application"
    - ldtccat:
        raise: "Step LDTCCAT runs program IKJEFT01, which is not part of the modernized application"
    - finalize:
        return: ${"Job creadb21 completed, execution " + executionId}
