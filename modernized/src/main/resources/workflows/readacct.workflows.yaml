# Google Cloud Workflows definition modernized from JCL: READACCT
# Source: app/jcl/READACCT.jcl
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - predel:
        raise: "Step PREDEL runs program IEFBR14, which is not part of the modernized application"
    - step05:
        call: http.post
        args:
          url: "__SERVICE_URL__/api/v1/jobs/CBACT01C/execute"
          auth:
            type: OIDC
          body:
            jobName: "readacct"
            stepName: "STEP05"
            program: "CBACT01C"
            executionId: ${executionId}
        result: step05_result
    - finalize:
        return: ${"Job readacct completed, execution " + executionId}
