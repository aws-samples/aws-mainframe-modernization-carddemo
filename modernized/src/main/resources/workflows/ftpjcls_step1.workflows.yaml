# Google Cloud Workflows definition modernized from JCL: FTPJCLS_STEP1
# Source: FTPJCLS_STEP1 (source not found)
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
# No EXEC steps were found in the JCL source; none are invented.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - finalize:
        return: ${"Job ftpjcls_step1 completed, execution " + executionId}
