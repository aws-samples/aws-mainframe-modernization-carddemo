# Google Cloud Workflows definition modernized from JCL: BUILDONL
# Source: samples/proc/BUILDONL.prc
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - cob:
        raise: "Step COB runs program IGYCRCTL, which is not part of the modernized application"
    - displist:
        raise: "Step DISPLIST runs program IEBGENER, which is not part of the modernized application"
    - copylink:
        raise: "Step COPYLINK runs program IEBGENER, which is not part of the modernized application"
    - lked:
        raise: "Step LKED runs program HEWL, which is not part of the modernized application"
    - finalize:
        return: ${"Job buildonl completed, execution " + executionId}
