# Google Cloud Workflows definition modernized from JCL: FTPJCL
# Source: app/jcl/FTPJCL.JCL
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - step1:
        raise: "Step STEP1 runs program FTP, which is not part of the modernized application"
    - finalize:
        return: ${"Job ftpjcl completed, execution " + executionId}
