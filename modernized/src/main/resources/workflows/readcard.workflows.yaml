# Google Cloud Workflows definition modernized from JCL: READCARD
# Source: app/jcl/READCARD.jcl
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - step05:
        call: http.post
        args:
          url: "__SERVICE_URL__/api/v1/jobs/CBACT02C/execute"
          auth:
            type: OIDC
          body:
            jobName: "readcard"
            stepName: "STEP05"
            program: "CBACT02C"
            executionId: ${executionId}
        result: step05_result
    - finalize:
        return: ${"Job readcard completed, execution " + executionId}
