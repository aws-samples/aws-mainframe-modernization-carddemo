        raise: "Step STEP01 runs program IEBGENER, which is not part of the modernized application"
    - step02:
        raise: "Step STEP02 runs program IDCAMS, which is not part of the modernized application"
    - step03:
        raise: "Step STEP03 runs program IDCAMS, which is not part of the modernized application"
    - step04:
        raise: "Step STEP04 runs program IDCAMS, which is not part of the modernized application"
    - step05:
        raise: "Step STEP05 runs program IDCAMS, which is not part of the modernized application"
    - finalize:
        return: ${"Job esdsrrds completed, execution " + executionId}
