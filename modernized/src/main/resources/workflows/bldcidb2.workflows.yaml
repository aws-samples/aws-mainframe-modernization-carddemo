# Google Cloud Workflows definition modernized from JCL: BLDCIDB2
# Source: samples/proc/BLDCIDB2.prc
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - precmp:
        raise: "Step PRECMP runs program DSNHPC, which is not part of the modernized application"
    - trn:
        raise: "Step TRN runs program DFHECP1$, which is not part of the modernized application"
    - cobol:
        raise: "Step COBOL runs program IGYCRCTL, which is not part of the modernized application"
    - lked:
        raise: "Step LKED runs program HEWL, which is not part of the modernized application"
    - bindpk:
        raise: "Step BINDPK runs program IKJEFT01, which is not part of the modernized application"
    - bindpl:
        raise: "Step BINDPL runs program IKJEFT01, which is not part of the modernized application"
    - finalize:
        return: ${"Job bldcidb2 completed, execution " + executionId}
