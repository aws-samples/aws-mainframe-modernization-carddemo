# Google Cloud Workflows definition modernized from JCL: MNTTRDB2
# Source: app/app-transaction-type-db2/jcl/MNTTRDB2.jcl
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - step1:
        raise: "Step STEP1 runs program IKJEFT01, which is not part of the modernized application"
    - finalize:
        return: ${"Job mnttrdb2 completed, execution " + executionId}
