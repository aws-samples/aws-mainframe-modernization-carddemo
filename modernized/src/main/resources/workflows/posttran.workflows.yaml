# Google Cloud Workflows definition modernized from JCL: POSTTRAN
# Source: app/jcl/POSTTRAN.jcl
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - step15:
        call: http.post
        args:
          url: "__SERVICE_URL__/api/v1/jobs/CBTRN02C/execute"
          auth:
            type: OIDC
          body:
            jobName: "posttran"
            stepName: "STEP15"
            program: "CBTRN02C"
            executionId: ${executionId}
        result: step15_result
    - finalize:
        return: ${"Job posttran completed, execution " + executionId}
