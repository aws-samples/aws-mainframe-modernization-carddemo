# Google Cloud Workflows definition modernized from JCL: BUILDBMS
# Source: samples/proc/BUILDBMS.prc
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - print:
        raise: "Step PRINT runs program IEBGENER, which is not part of the modernized application"
    - map:
        raise: "Step MAP runs program ASMA90, which is not part of the modernized application"
    - lked:
        raise: "Step LKED runs program HEWL, which is not part of the modernized application"
    - dsect:
        raise: "Step DSECT runs program ASMA90, which is not part of the modernized application"
    - displist:
        raise: "Step DISPLIST runs program IEBGENER, which is not part of the modernized application"
    - deltemp:
        raise: "Step DELTEMP runs program IEFBR14, which is not part of the modernized application"
    - finalize:
        return: ${"Job buildbms completed, execution " + executionId}
