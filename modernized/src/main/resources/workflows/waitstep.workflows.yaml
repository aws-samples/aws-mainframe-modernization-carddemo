# Google Cloud Workflows definition modernized from JCL: WAITSTEP
# Source: app/jcl/WAITSTEP.jcl
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - wait:
        call: http.post
        args:
          url: "__SERVICE_URL__/api/v1/jobs/COBSWAIT/execute"
          auth:
            type: OIDC
          body:
            jobName: "waitstep"
            stepName: "WAIT"
            program: "COBSWAIT"
            executionId: ${executionId}
        result: wait_result
    - finalize:
        return: ${"Job waitstep completed, execution " + executionId}
