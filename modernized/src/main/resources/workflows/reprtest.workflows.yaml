# Google Cloud Workflows definition modernized from JCL: REPRTEST
# Source: samples/jcl/REPRTEST.jcl
# __SERVICE_URL__ is replaced with the Cloud Run URL by Agent 09's Terraform.
main:
  params: [args]
  steps:
    - init:
        assign:
          - executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - step05:
        raise: "Step STEP05 runs procedure REPROC, which is not part of the modernized application"
    - finalize:
        return: ${"Job reprtest completed, execution " + executionId}
